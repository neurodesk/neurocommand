# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  # Do not post skipped-review comments; they create notifications for PRs
  # that are intentionally outside CodeRabbit's review scope.
  review_status: false
  path_filters:
    - "!neurodesk/apps.json"
  auto_review:
    # Only review when explicitly requested with "@coderabbitai review".
    enabled: false
    auto_incremental_review: false
