name: Test neurocommand
permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: test-neurocommand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  unit_tests:
    name: unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r test/requirements.txt
      - name: Run unit tests
        run: python maintenance/check.py tests

  module_engines:
    name: module integration (${{ matrix.package }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [lmod, environment-modules]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install module engine and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.package }}
          python -m pip install -r test/requirements.txt
      - name: Run complete suite with installed engine
        env:
          MODULE_ENGINE_PACKAGE: ${{ matrix.package }}
        run: |
          if [ "$MODULE_ENGINE_PACKAGE" = "lmod" ]; then
            source /usr/share/lmod/lmod/init/bash
            export NEUROCOMMAND_TEST_ENGINE=lmod
          else
            export NEUROCOMMAND_TEST_ENGINE=modules
          fi
          python maintenance/check.py tests

  slim_image:
    name: build slim image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build slim image
        run: docker build -f singularity/Dockerfile-slim .

  test_neurocommand:
    name: test (CVMFS=${{ matrix.cvmfs }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cvmfs: [enabled, disabled]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull neurocommand image
        run: docker pull ghcr.io/neurodesk/neurocommand:latest
      - name: Run neurocommand fetch test inside image
        run: |
          CVMFS_ENV=()
          if [ "${{ matrix.cvmfs }}" = "disabled" ]; then
            CVMFS_ENV=(-e NEURODESK_CVMFS_DISABLE=1)
          fi
          docker run --rm --privileged --user=root "${CVMFS_ENV[@]}" \
            -e NB_UID="$(id -u)" -e NB_GID="$(id -g)" \
            -v "${{ github.workspace }}:/work" -w /work \
            -v "${{ github.workspace }}/docker/before-notebook.d/01-cvmfs-mount.sh:/usr/local/bin/before-notebook.d/01-cvmfs-mount.sh:ro" \
            ghcr.io/neurodesk/neurocommand:latest \
            bash -lc '
              set -e
              container_root="${NEURODESKTOP_LOCAL_CONTAINERS:-local/containers}"
              if [ "${{ matrix.cvmfs }}" = "enabled" ]; then
                cached_image="/cvmfs/neurodesk.ardc.edu.au/containers/niimath_1.0.0_20250617/niimath_1.0.0_20250617.simg"
                if [ "${CVMFS_DISABLE:-false}" != "false" ] || [ ! -d "$cached_image" ]; then
                  echo "[test] ERROR: CVMFS niimath sandbox is unavailable: $cached_image" >&2
                  exit 1
                fi
              fi
              bash build.sh --cli
              bash containers.sh all
              bash local/fetch_containers.sh niimath 1.0.0 20250617 niimath
              image="${container_root}/niimath_1.0.0_20250617/niimath_1.0.0_20250617.simg"
              # CVMFS images are sandbox directories, deployed as symlinks.
              if [ "${{ matrix.cvmfs }}" = "enabled" ]; then
                test -L "$image"
                test -d "$image"
              else
                test -f "$image"
              fi
              test -f "${container_root}/niimath_1.0.0_20250617/niimath"
              "${container_root}/niimath_1.0.0_20250617/niimath" --version
              echo "[test] OK"
            '

  required:
    name: quality required
    if: ${{ always() }}
    needs: [quality, unit_tests, module_engines, slim_image, test_neurocommand]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["CHECK_RESULTS"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failures:
              print(f"Required quality jobs did not succeed: {failures}")
              sys.exit(1)
          PY
